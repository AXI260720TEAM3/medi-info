# 화면: 1단계에서 만든 nginx 이미지 (frontend/Dockerfile.prod)
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: medi-info
spec:
  selector:
    app: web
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: medi-info
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: localhost:5000/medi-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          # nginx가 멈췄을 때 다시 켜기
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 20
          # 새 버전으로 바꿀 때 3초 더 버티기 (backend.yaml과 같은 이유)
          lifecycle:
            preStop:
              sleep:
                seconds: 3
