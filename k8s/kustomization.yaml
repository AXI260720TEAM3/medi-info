# kubectl apply -k k8s 로 아래 파일을 한꺼번에 적용해요 (보통은 deploy.sh가 함)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - config.yaml
  - db.yaml
  - ollama.yaml
  - backend.yaml
  - web.yaml
  - ingress.yaml
  - privacy-cron.yaml
  - dict-job.yaml
  - backup.yaml
  - ops.yaml
