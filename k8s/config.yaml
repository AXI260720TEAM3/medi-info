# 비밀이 아닌 설정 (docker-compose.yml의 environment와 같은 역할)
# 비밀 값(DB 비밀번호, 공공데이터 키, JWT, 메일)은 Secret "medi-secrets"에 있어요. deploy.sh가 .env로 만들어요
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: medi-info
data:
  DB_HOST: db              # 아래 db Service 이름 = 클러스터 안의 주소
  DB_PORT: "5432"
  OLLAMA_URL: http://ollama:11434   # ollama.yaml의 Service (k8s 밖, 이 PC의 Ollama로 연결)
  OLLAMA_NUM_CTX: "16384"           # 이 PC Ollama의 OLLAMA_CONTEXT_LENGTH와 같은 값 (다르면 모델을 계속 다시 올려요). .env 값은 k8s에 안 들어와요
  OPS_URL: http://ops:8000          # 운영 API (ops.yaml). compose에는 없어서 운영 탭은 k8s에서만 돼요
  ADMIN_HOSTS: medi.localhost       # 관리자 API를 받는 주소. Funnel 주소로 온 요청은 관리자 API가 없는 척(404)
