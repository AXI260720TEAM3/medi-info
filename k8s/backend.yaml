# FastAPI 백엔드. Deployment라서 파드가 죽으면 k8s가 새로 만들어요
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: medi-info
spec:
  selector:
    app: backend
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: medi-info
spec:
  replicas: 1
  revisionHistoryLimit: 5   # 되돌리기(rollout undo)용으로 옛 버전 5개를 기억
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # WSL 미러 네트워크에서 바깥(공공 API)으로 나가는 연결이 끊기던 문제 (docker-compose.override.yml과 같은 값)
      securityContext:
        sysctls:
          - name: net.ipv4.ip_local_port_range
            value: "44620 48715"
      containers:
        - name: backend
          image: localhost:5000/medi-backend:dev   # deploy.sh가 :dev를 그때 버전으로 바꿔요
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: medi-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # 상태 검사 (backend/app/routes/health.py)
          # 처음 켜질 때(서버가 준비되는 동안)는 이것만 봐요. 통과하기 전엔 아래 두 검사를 하지 않아요
          startupProbe:
            httpGet: { path: /api/health/live, port: 8000 }
            periodSeconds: 2
            failureThreshold: 30        # 최대 60초 기다려요
          # 살아 있나: 3번 연속(30초) 응답이 없으면 k8s가 파드를 다시 켜요
          livenessProbe:
            httpGet: { path: /api/health/live, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 손님 받을 준비가 됐나: DB가 안 되면 다시 켜지 않고, 잠깐 요청만 보내지 않아요
          readinessProbe:
            httpGet: { path: /api/health/ready, port: 8000 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # 새 버전으로 바꿀 때: 꺼지라는 신호를 받아도 3초 더 버텨요.
          # 그사이 Traefik이 "이 파드는 빠졌다"를 알아채서, 꺼진 파드로 요청을 보내 502가 나는 일이 없어요
          lifecycle:
            preStop:
              sleep:
                seconds: 3
