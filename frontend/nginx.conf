# 배포용 nginx 설정 (Dockerfile.prod). /api는 여기로 오지 않아요: k8s Ingress가 백엔드로 보내요
server {
    listen 8080;
    root /usr/share/nginx/html;

    # 빌드 파일(assets/)은 이름에 내용 지문이 붙어 있어서 오래 저장해도 돼요
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
