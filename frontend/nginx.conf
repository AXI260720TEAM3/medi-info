# 배포용 nginx 설정 (Dockerfile.prod). /api는 여기로 오지 않아요: k8s Ingress가 백엔드로 보내요
server {
    listen 8080;
    root /usr/share/nginx/html;

    # 빌드 파일(assets/)은 이름에 내용 지문이 붙어 있어서 오래 저장해도 돼요
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 화면의 첫 파일은 늘 서버에 "바뀌었나?"를 물어보게 해요 (no-cache = 저장은 하되 쓰기 전에 확인)
    # 예전엔 캐시 지시가 없어 브라우저가 알아서 한동안 옛 index.html을 썼고,
    # 그 파일이 옛 assets를 불러서 배포한 뒤에도 지운 하단 문구가 다시 보였어요 (11/12)
    # 바뀌지 않았으면 304(본문 없음)라 느려지지 않아요
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 서비스 워커·앱 정보(PWA)도 이름이 늘 같아서 같은 이유로 확인하게 해요
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;   # nginx 기본 목록에 .webmanifest가 없어 octet-stream으로 나가던 것
        add_header Cache-Control "no-cache";
    }

    # 화면 주소(/chat, /my-meds …)는 index.html로 넘겨요. 넘어간 요청도 위의 /index.html 규칙을 따라요
    location / {
        try_files $uri $uri/ /index.html;
    }
}
